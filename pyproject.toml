[project]
name = "dandifs"
authors = [{name = "Yael Balbastre", email = "y.balbastre@ucl.ac.uk"}]
maintainers = [{name = "Yael Balbastre", email = "y.balbastre@ucl.ac.uk"}]
description = "A fsspec filesystem for the DANDI archive"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.8"
dependencies = [
    "fsspec[http] >= 2022.1.0",     # async filesystem base + HTTP backend (aiohttp)
    "aiohttp",                      # async HTTP client (also pulled by fsspec[http])
    "typing_extensions",            # Self/TypeAlias etc. on Python < 3.11
]
dynamic = ["version"]

[project.optional-dependencies]
# Credential storage for private / embargoed dandisets. Imported lazily; the
# library works fully without it.
auth = [
    "keyring != 23.9.0",
    "keyrings.alt",
    "pycryptodomex",
]
# Offline test suite (all HTTP mocked).
test = [
    "pytest",
    "pytest-asyncio",
    "aioresponses",
    # aioresponses (<=0.7.9) has not adapted to the ClientResponse changes in
    # aiohttp 3.14, so cap aiohttp for the *test environment only*. The library
    # itself imposes no aiohttp upper bound.
    "aiohttp<3.14",
]
# Linters run by CI (and usable locally / via pre-commit).
lint = [
    "ruff==0.16.5",
    "codespell",
]

[project.urls]
Homepage = "https://github.com/balbasty/dandifs"
Issues = "https://github.com/balbasty/dandifs/issues"

[build-system]
requires = [
  "setuptools >= 61.0",
  "wheel",
  "versioningit >= 1.0",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dandifs*"]

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.format]
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "dandifs/_version.py"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["dandifs/tests"]
asyncio_mode = "auto"

[tool.codespell]
skip = "./.git,./OTHER_LICENSES,./LICENSE,./dandifs/_version.py"
check-filenames = true

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
exclude = [
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".tox",
  ".venv",
  "_build",
  "build",
  "dist",
  "venv",
]
# ruff >= 0.16 formats Python code blocks inside Markdown; keep ruff scoped to
# Python only so it doesn't reflow the hand-aligned examples in the README.
extend-exclude = ["*.md"]
line-length = 88
indent-width = 4
src = ["."]
target-version = "py38"

[tool.ruff.lint]
select = ["ANN", "D", "E", "F", "I"]
ignore = [
  "ANN002",  # args should not be annotated
  "ANN003",  # kwargs should not be annotated
  "ANN401",  # dynamically typed expressions (typing.Any)
  "D105",    # missing docstring in magic method
  "D200",    # one line docstrings should fit one line
  "D202",    # no blank line between docstring and body of a function
  "D205",    # 1 blank line required between summary line and description
  "D401",    # first line of docstring must be imperative
  "D404",    # first word of docstring must not be "This"
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"dandifs/tests/*.py" = ["D", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
