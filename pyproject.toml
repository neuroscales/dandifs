[project]
name = "dandifs"
authors = [{name = "Yael Balbastre", email = "y.balbastre@ucl.ac.uk"}]
maintainers = [{name = "Yael Balbastre", email = "y.balbastre@ucl.ac.uk"}]
description = "A fsspec filesystem for the DANDI archive"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
requires-python = ">=3.10"
dependencies = [
    "fsspec[https] >= 2021.0.0",    # First stable release
    "universal_pathlib",            # UPath
    "requests",                     # HTTP requests
    "tenacity",                     # Retry requests
    "yarl",                         # Yet Another URL Library
    "keyring != 23.9.0",            # Authentification
    "python-dateutil",              # Parse API dates
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/balbasty/dandifs"
Issues = "https://github.com/balbasty/dandifs/issues"

[build-system]
requires = [
  "setuptools >= 61.0",
  "wheel",
  "versioningit >= 1.0",
]
build-backend = "setuptools.build_meta"

[tool.versioningit]
default-version = "0+unknown"

[tool.versioningit.format]
# Same format as versioneer
distance = "{base_version}+{distance}.{vcs}{rev}"
dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"
distance-dirty = "{base_version}+{distance}.{vcs}{rev}.dirty"

[tool.versioningit.write]
file = "dandfs/_version.py"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
testpaths = [
  "dandfs/tests"
]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv"
]
line-length = 88
indent-width = 4
src = ["."]
target-version = "py310"

[tool.ruff.lint]
select = ["ANN", "D", "E", "F", "I"]
ignore = [
  "ANN002",  # args should not be annotated
  "ANN003",  # kwargs should not be annotated
  "ANN101",  # self should not be annotated.
  "ANN102",  # cls should not be annotated.
  "ANN401",  # Dynamically typed expressions (typing.Any)
  "D105",    # Missing docstring in magic method
  "D200",    # One line docstrings should fit one line
  "D202",    # No blank line between docstring and body of a function
  "D205",    # 1 blank line required between summary line and description -> triggered in __init__ docstrings
  "D401",    # First line of docstring must be imperative
  "D404",    # Forst word of docstring must not be "This"
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"ngtools/tests/*.py" = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
